name: CI — ndn-repo

# Depends on ndn-rs + ndn-ext via ../ path deps → sibling checkout.

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: repo (clippy / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext } # pinned sibling; bump deliberately
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ndn-repo }
      - name: Format
        working-directory: ndn-repo
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: ndn-repo
        run: cargo clippy --all-features -- -D warnings
      - name: Test
        working-directory: ndn-repo
        run: cargo test --all-features
      - name: Doc build
        working-directory: ndn-repo
        run: cargo doc --no-deps
