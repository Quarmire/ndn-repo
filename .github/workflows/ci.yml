name: CI — ndn-repo

# Depends on ndn-rs + ndn-ext + ndn-radio (ndn-coding) + ndn-radio-drivers (ndn-frame-io, pulled
# in by ndn-coding) via ../ path deps → sibling checkouts. Bump the pins together.

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: repo (fmt / clippy / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-repo }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 32b1c8e70cfcc672e6fbf0d6c8bde02580c7ab83, path: ndn-rs } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 226eec4cdf5be0cdbf408502bada87d7c386a9f7, path: ndn-ext } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio", ref: e4961e83d42b36dfa9723d4ab76f86dc99b35830, path: ndn-radio } # pinned sibling; bump deliberately
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: 985cd9d70ce0664c6b622da29545c6aa2cd0448c, path: ndn-radio-drivers } # pinned sibling; bump deliberately
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ndn-repo }
      # Scoped to this repo's members: `cargo fmt --all` also walks the sibling path deps,
      # whose formatting is their own repos' gate.
      - name: Format
        working-directory: ndn-repo
        run: cargo fmt -p ndn-repo -p ndn-repo-cluster -- --check
      - name: Lint
        working-directory: ndn-repo
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: ndn-repo
        run: cargo test --workspace --all-features
      - name: Doc build
        working-directory: ndn-repo
        env: { RUSTDOCFLAGS: "-D warnings" }
        run: cargo doc --no-deps --workspace --all-features
