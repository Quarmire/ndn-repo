[package]
name = "ndn-repo"
description = "Persistent named-data repository (ndnd RepoCmd-compatible): durable ingest + serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
# Durable on-disk DataStore backend (native). On by default; disable for a
# target-agnostic, codec-only build (e.g. wasm). `FjallStore` writes and syncs
# through ndn-sync's `BackendStore` (group commit, sticky write failures).
default = ["fjall-store"]
fjall-store = ["dep:fjall", "dep:ndn-storage", "ndn-sync/store-fjall"]
# A custody holder's storage (`held`): its own names in a FjallStore, what it
# holds for others erasure-coded across stripe stores (ndn-coding's K-of-N codec).
held = ["fjall-store", "dep:ndn-coding", "dep:sha2"]
# The runnable `ndn-repo` daemon (Unix-socket IPC to a forwarder), including
# `ndn-repo hold` (an ndn-data custody holder over `held` storage). Off by
# default so the library stays light; build with `--features bin`.
bin = [
    "fjall-store",
    "held",
    "dep:ndn-app",
    "dep:ndn-ipc",
    "dep:ndn-ipc-shm",
    "dep:ndn-data",
    "dep:ndn-cert",
    "dep:serde_json",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/io-std",
    "tokio/io-util",
]

[dependencies]
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-sync     = { workspace = true }
ndn-security = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
fjall      = { workspace = true, optional = true }
# The pluggable storage substrate: the fjall LSM engine + name→wire key codec.
# Replaces ndn-repo's hand-rolled fjall binding and `name_to_key`.
ndn-storage = { workspace = true, optional = true, features = ["fjall", "named"] }
# Held storage (feature `held`): the systematic K-of-N codec and shard digests.
ndn-coding = { workspace = true, optional = true }
sha2       = { workspace = true, optional = true }
# Daemon-only (feature `bin`).
ndn-app            = { workspace = true, optional = true }
ndn-ipc            = { workspace = true, optional = true }
ndn-ipc-shm        = { workspace = true, optional = true }
anyhow             = { workspace = true, optional = true }
ndn-data           = { workspace = true, optional = true }
ndn-cert           = { workspace = true, optional = true }
serde_json         = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[[bin]]
name = "ndn-repo"
required-features = ["bin"]

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile   = "3"
